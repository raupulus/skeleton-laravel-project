# Configuración de Nginx para Laravel en producción
# Ruta: /etc/nginx/sites-available/skeleton-laravel
# Activar: sudo ln -s /etc/nginx/sites-available/skeleton-laravel /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    # Redirigir HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # Directorio raíz — apuntar al directorio public de Laravel
    root /var/www/skeleton-laravel/public;
    index index.php;

    # Certificados SSL (usando Certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Tamaño máximo de subida de archivos
    client_max_body_size 50M;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Caché de assets estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manejar todas las peticiones a través del index.php de Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesar archivos PHP con PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Denegar acceso a archivos .htaccess y .env
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Bloquear ejecución de archivos PHP en el directorio de uploads (seguridad)
    location ~* /storage/.*\.php$ {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/skeleton-laravel_access.log;
    error_log /var/log/nginx/skeleton-laravel_error.log;
}
