# Configuración de Apache para Laravel en producción
# Archivo: /etc/apache2/sites-available/skeleton-laravel.conf
# Activar: sudo a2ensite skeleton-laravel.conf && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName tudominio.com
    ServerAlias www.tudominio.com

    # Redirigir HTTP a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName tudominio.com
    ServerAlias www.tudominio.com

    # Directorio raíz — apuntar al directorio public de Laravel
    DocumentRoot /var/www/skeleton-laravel/public

    # Certificados SSL
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tudominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tudominio.com/privkey.pem

    # Tamaño máximo de subida
    LimitRequestBody 52428800

    <Directory /var/www/skeleton-laravel/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Soporte para URLs amigables de Laravel
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Denegar acceso a archivos sensibles
    <FilesMatch "(\.env|\.htaccess|composer\.lock|package\.lock\.json)">
        Require all denied
    </FilesMatch>

    # Cabeceras de seguridad
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # Caché de assets estáticos (1 año)
    <LocationMatch "\.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header append Cache-Control "public, immutable"
    </LocationMatch>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/skeleton-laravel_error.log
    CustomLog ${APACHE_LOG_DIR}/skeleton-laravel_access.log combined
</VirtualHost>
