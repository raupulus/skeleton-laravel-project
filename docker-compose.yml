# Docker Compose para desarrollo local del Skeleton Laravel Project
# Uso: docker compose up -d
# Variables configurables en el archivo .env

version: '3.9'

services:
  # Aplicación PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skeleton_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # Storage externo persistente (se mantiene al redesplegar)
      - ${STORAGE_PATH:-./storage}:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-skeleton_laravel}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - skeleton_network

  # Servidor Nginx
  nginx:
    image: nginx:alpine
    container_name: skeleton_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - skeleton_network

  # Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: skeleton_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-skeleton_laravel}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      # Datos de BD persistentes fuera del contenedor
      - ${DB_STORAGE_PATH:-postgres_data}:/var/lib/postgresql/data
    ports:
      - "${DB_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skeleton_network

  # Redis para caché y colas
  redis:
    image: redis:7-alpine
    container_name: skeleton_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${REDIS_STORAGE_PATH:-redis_data}:/data
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    networks:
      - skeleton_network

volumes:
  postgres_data:
  redis_data:

networks:
  skeleton_network:
    driver: bridge
