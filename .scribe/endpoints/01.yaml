        custom: []
        status: 200
        content: '{"current_page":1,"data":[{"id":10,"slug":"vue3-alpinejs-frontend","title":{"en":"Vue 3 and Alpine.js in the frontend","es":"Vue 3 y Alpine.js en el frontend"},"content":{"en":"<h2>Vue 3: ready but not active by default<\/h2><p>Integrated via Vite. Mount point: <code>&lt;div id=\"vue-app\"&gt;<\/code>.<\/p><h2>Alpine.js for light interactivity<\/h2><p>Already loaded. Recommended for simple toggles, dropdowns and animations.<\/p>","es":"<h2>Vue 3: preparado, no activo por defecto<\/h2><p>Vue 3 est\u00e1 integrado v\u00eda Vite pero no se usa en producci\u00f3n a\u00fan. El punto de montaje en el home es <code>&lt;div id=\"vue-app\"&gt;<\/code>.<\/p><h2>A\u00f1adir un componente Vue<\/h2><p>1. Crea <code>resources\/js\/components\/MiComponente.vue<\/code>:<\/p><pre><code>&lt;template&gt;\\n  &lt;div&gt;&lt;button @click=\"count++\"&gt;&#123;&#123; count &#125;&#125;&lt;\/button&gt;&lt;\/div&gt;\\n&lt;\/template&gt;\\n&lt;script setup&gt;\\nimport { ref } from ''vue''\\nconst count = ref(0)\\n&lt;\/script&gt;<\/code><\/pre><p>2. Reg\u00edstralo en <code>resources\/js\/app.js<\/code>:<\/p><pre><code>import MiComponente from ''.\/components\/MiComponente.vue''\\napp.component(''mi-componente'', MiComponente)<\/code><\/pre><p>3. \u00dasalo en Blade dentro de <code>#vue-app<\/code>:<\/p><pre><code>&lt;div id=\"vue-app\"&gt;&lt;mi-componente \/&gt;&lt;\/div&gt;<\/code><\/pre><h2>Alpine.js para interactividad ligera<\/h2><pre><code>&lt;!-- Toggle --&gt;\\n&lt;div x-data=\"{ open: false }\"&gt;\\n  &lt;button @click=\"open = !open\"&gt;Toggle&lt;\/button&gt;\\n  &lt;div x-show=\"open\"&gt;Contenido&lt;\/div&gt;\\n&lt;\/div&gt;<\/code><\/pre><h2>\u00bfCu\u00e1ndo usar cada uno?<\/h2><table><thead><tr><th>Caso de uso<\/th><th>Recomendaci\u00f3n<\/th><\/tr><\/thead><tbody><tr><td>Toggle, dropdown, modals simples<\/td><td>Alpine.js<\/td><\/tr><tr><td>Formularios reactivos complejos<\/td><td>Vue 3<\/td><\/tr><tr><td>Componentes con estado complejo<\/td><td>Vue 3<\/td><\/tr><\/tbody><\/table>"},"excerpt":{"en":"How to add Vue 3 components to the Blade frontend and when to use Alpine.js for light interactivity.","es":"C\u00f3mo a\u00f1adir componentes Vue 3 al frontend Blade y cu\u00e1ndo usar Alpine.js para interactividad ligera."},"image":null,"status":"published","is_active":true,"featured":false,"user_id":1,"seo_title":{"en":"Vue 3 and Alpine.js in the Laravel frontend","es":"Vue 3 y Alpine.js en el frontend Laravel"},"seo_description":{"en":"How to use Vue 3 and Alpine.js in the project: when to use each, adding components and mount points.","es":"C\u00f3mo usar Vue 3 y Alpine.js en el proyecto: cu\u00e1ndo usar cada uno, a\u00f1adir componentes y puntos de montaje."},"seo_keywords":null,"published_at":"2026-05-01T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-12T18:21:26.000000Z","deleted_at":null,"categories":[{"id":2,"slug":"desarrollo","name":{"en":"Development","es":"Desarrollo"},"pivot":{"post_id":10,"category_id":2}}]},{"id":9,"slug":"sistema-autenticacion-web-api","title":{"en":"Authentication system: Web and API","es":"Sistema de autenticaci\u00f3n: Web y API"},"content":{"en":"<h2>Roles (PHP 8.4 Backed Enum)<\/h2><pre><code>enum Role: string { case SuperAdmin = ''superadmin''; case Admin = ''admin''; case User = ''user''; }<\/code><\/pre><h2>Panel access<\/h2><p>User model implements <code>canAccessPanel(Panel $panel)<\/code> to control access to each panel.<\/p>","es":"<h2>Autenticaci\u00f3n web (Laravel Breeze)<\/h2><p>Rutas en <code>routes\/auth.php<\/code>: login, register, logout, forgot-password, reset-password, verify-email.<\/p><h2>Roles de usuario (Enum PHP 8.4)<\/h2><pre><code>enum Role: string\\n{\\n    case SuperAdmin = ''superadmin'';\\n    case Admin      = ''admin'';\\n    case User       = ''user'';\\n}\\n\\n\/\/ Comprobaci\u00f3n\\nif ($user->role === Role::Admin) { ... }<\/code><\/pre><h2>Acceso a paneles Filament<\/h2><p>El modelo <code>User<\/code> implementa <code>canAccessPanel(Panel $panel)<\/code>:<\/p><ul><li><strong>Panel Admin<\/strong>: solo <code>superadmin<\/code> y <code>admin<\/code><\/li><li><strong>Panel Usuario<\/strong>: cualquier usuario con <code>is_active = true<\/code><\/li><\/ul><h2>Pol\u00edticas de autorizaci\u00f3n<\/h2><p>Cada modelo tiene su Policy en <code>app\/Policies\/<\/code>. Patr\u00f3n: solo admins pueden crear\/editar\/eliminar:<\/p><pre><code>public function create(User $user): bool\\n{\\n    return in_array($user->role, [Role::Admin, Role::SuperAdmin]);\\n}<\/code><\/pre><h2>Autenticaci\u00f3n API con Sanctum<\/h2><p>Ver el post <em>API REST con Laravel Sanctum<\/em> para el flujo completo de obtenci\u00f3n y uso de tokens.<\/p>"},"excerpt":{"en":"How authentication works in the project: Laravel Breeze for web, Sanctum for API, user roles and access policies.","es":"C\u00f3mo funciona la autenticaci\u00f3n en el proyecto: Laravel Breeze para web, Sanctum para API, roles de usuario y pol\u00edticas de acceso."},"image":null,"status":"published","is_active":true,"featured":false,"user_id":1,"seo_title":{"en":"Web and API authentication with Sanctum","es":"Autenticaci\u00f3n web y API con Sanctum"},"seo_description":{"en":"Project authentication system: Breeze, Sanctum, PHP enum roles and access policies.","es":"Sistema de autenticaci\u00f3n del proyecto: Breeze, Sanctum, roles PHP enum y pol\u00edticas de acceso."},"seo_keywords":null,"published_at":"2026-04-29T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-11T21:42:53.000000Z","deleted_at":null,"categories":[{"id":2,"slug":"desarrollo","name":{"en":"Development","es":"Desarrollo"},"pivot":{"post_id":9,"category_id":2}},{"id":1,"slug":"documentacion","name":{"en":"Documentation","es":"Documentaci\u00f3n"},"pivot":{"post_id":9,"category_id":1}}]},{"id":8,"slug":"comandos-artisan-personalizados","title":{"en":"Custom Artisan commands","es":"Comandos Artisan personalizados del proyecto"},"content":{"en":"<h2>project:install<\/h2><pre><code>php artisan project:install --force<\/code><\/pre><h2>project:clear<\/h2><pre><code>php artisan project:clear<\/code><\/pre><h2>sitemap:generate<\/h2><pre><code>php artisan sitemap:generate<\/code><\/pre>","es":"<h2>project:install<\/h2><p>Instala y configura el proyecto desde cero con confirmaciones interactivas.<\/p><pre><code>php artisan project:install\\n# O sin confirmaciones (CI\/CD o Docker):\\nphp artisan project:install --force<\/code><\/pre><p>Ejecuta: key:generate \u2192 storage:link \u2192 migrate \u2192 db:seed \u2192 cache:clear \u2192 npm run build (opcional).<\/p><h2>project:clear<\/h2><p>Limpia toda la cach\u00e9. \u00datil tras subir cambios al servidor.<\/p><pre><code>php artisan project:clear<\/code><\/pre><p>Limpia: config, rutas, vistas compiladas, cach\u00e9 de aplicaci\u00f3n y eventos.<\/p><h2>sitemap:generate<\/h2><p>Genera <code>public\/sitemap.xml<\/code> con todas las URLs p\u00fablicas.<\/p><pre><code>php artisan sitemap:generate<\/code><\/pre><p>Se puede programar en <code>routes\/console.php<\/code>:<\/p><pre><code>Schedule::command(''sitemap:generate'')->daily();<\/code><\/pre>"},"excerpt":{"en":"The three project artisan commands: project:install, project:clear and sitemap:generate. When to use them and what they do exactly.","es":"Los tres comandos artisan del proyecto: project:install, project:clear y sitemap:generate. Cu\u00e1ndo usarlos y qu\u00e9 hacen exactamente."},"image":null,"status":"published","is_active":true,"featured":false,"user_id":1,"seo_title":{"en":"Project Artisan commands: install, clear, sitemap","es":"Comandos Artisan del proyecto: install, clear, sitemap"},"seo_description":{"en":"Project artisan commands reference: what they do, when to use them and how to schedule them.","es":"Referencia de los comandos artisan del proyecto: qu\u00e9 hacen, cu\u00e1ndo usarlos y c\u00f3mo programarlos."},"seo_keywords":null,"published_at":"2026-04-27T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-11T21:42:53.000000Z","deleted_at":null,"categories":[{"id":2,"slug":"desarrollo","name":{"en":"Development","es":"Desarrollo"},"pivot":{"post_id":8,"category_id":2}},{"id":1,"slug":"documentacion","name":{"en":"Documentation","es":"Documentaci\u00f3n"},"pivot":{"post_id":8,"category_id":1}}]},{"id":7,"slug":"settings-dinamicos-helper-global","title":{"en":"Dynamic settings and global helper setting()","es":"Settings din\u00e1micos y helper global setting()"},"content":{"en":"<h2>What are Settings?<\/h2><p>Key-value pairs in the <code>settings<\/code> table for configuring the site without touching code.<\/p><h2>Global helper<\/h2><pre><code>setting(''site_title'', ''My Site'');\\n\/\/ In Blade:\\n&#123;&#123; setting(''contact_email'') &#125;&#125;<\/code><\/pre>","es":"<h2>\u00bfQu\u00e9 son los Settings?<\/h2><p>Son pares key-value en la tabla <code>settings<\/code> para configurar el sitio sin tocar c\u00f3digo: t\u00edtulo, redes sociales, email de contacto, Google Analytics ID...<\/p><h2>Helper global<\/h2><pre><code>\/\/ En un controlador, servicio o vista Blade\\n$title = setting(''site_title'', ''Mi Sitio Web'');\\n\/\/ En Blade:\\n&#123;&#123; setting(''contact_email'', '''') &#125;&#125;<\/code><\/pre><h2>Settings disponibles por defecto<\/h2><table><thead><tr><th>Key<\/th><th>Grupo<\/th><\/tr><\/thead><tbody><tr><td>site_title<\/td><td>general<\/td><\/tr><tr><td>site_description<\/td><td>general<\/td><\/tr><tr><td>contact_email<\/td><td>contact<\/td><\/tr><tr><td>facebook_url<\/td><td>social<\/td><\/tr><tr><td>google_analytics_id<\/td><td>seo<\/td><\/tr><\/tbody><\/table><h2>Cach\u00e9 autom\u00e1tica<\/h2><p>El <code>SettingService<\/code> cachea los settings 1 hora. Invalida la cach\u00e9 manualmente con:<\/p><pre><code>php artisan cache:clear<\/code><\/pre><h2>A\u00f1adir un nuevo setting en el seeder<\/h2><pre><code>Setting::firstOrCreate(\\n    [''key'' => ''whatsapp_url''],\\n    [''display_name'' => ''WhatsApp URL'', ''value'' => '''', ''type'' => ''text'', ''group'' => ''social'']\\n);<\/code><\/pre>"},"excerpt":{"en":"How to use the dynamic configuration system: the setting() helper, automatic caching and how to add new keys from Filament.","es":"C\u00f3mo usar el sistema de configuraci\u00f3n din\u00e1mica: el helper setting(), la cach\u00e9 autom\u00e1tica y c\u00f3mo a\u00f1adir nuevas keys desde Filament."},"image":null,"status":"published","is_active":true,"featured":false,"user_id":1,"seo_title":{"en":"Dynamic settings system and setting() helper","es":"Sistema de settings din\u00e1micos y helper setting()"},"seo_description":{"en":"Settings system guide: global helper, caching, available keys and how to add new configurations.","es":"Gu\u00eda del sistema de settings: helper global, cach\u00e9, keys disponibles y c\u00f3mo a\u00f1adir nuevas configuraciones."},"seo_keywords":null,"published_at":"2026-04-25T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-12T18:21:26.000000Z","deleted_at":null,"categories":[{"id":1,"slug":"documentacion","name":{"en":"Documentation","es":"Documentaci\u00f3n"},"pivot":{"post_id":7,"category_id":1}}]},{"id":6,"slug":"despliegue-produccion-nginx","title":{"en":"Production deployment with Nginx","es":"Despliegue en producci\u00f3n con Nginx"},"content":{"en":"<h2>Server requirements<\/h2><ul><li>Ubuntu 22.04, PHP 8.4, PostgreSQL 16, Nginx, Certbot<\/li><\/ul><h2>Deployment<\/h2><pre><code>git pull origin main\\ncomposer install --no-dev --optimize-autoloader\\nnpm ci &amp;&amp; npm run build\\nphp artisan migrate --force\\nphp artisan optimize<\/code><\/pre>","es":"<h2>Requisitos del servidor<\/h2><ul><li>Ubuntu 22.04 \/ Debian 12<\/li><li>PHP 8.4 con extensiones: pdo_pgsql, mbstring, xml, curl, zip, gd<\/li><li>PostgreSQL 16, Nginx, Certbot (SSL)<\/li><li>Composer 2, Node.js 20, npm<\/li><\/ul><h2>Configuraci\u00f3n Nginx<\/h2><pre><code>sudo cp docs\/deploys\/nginx.conf \/etc\/nginx\/sites-available\/mi-proyecto\\nsudo ln -s \/etc\/nginx\/sites-available\/mi-proyecto \/etc\/nginx\/sites-enabled\/\\nsudo nginx -t &amp;&amp; sudo systemctl reload nginx<\/code><\/pre><h2>Variables de entorno para producci\u00f3n<\/h2><pre><code>APP_ENV=production\\nAPP_DEBUG=false\\nAPP_URL=https:\/\/tudominio.com\\nCACHE_STORE=redis\\nQUEUE_CONNECTION=redis\\nSESSION_DRIVER=redis<\/code><\/pre><h2>Proceso de despliegue<\/h2><pre><code>git pull origin main\\ncomposer install --no-dev --optimize-autoloader\\nnpm ci &amp;&amp; npm run build\\nphp artisan migrate --force\\nphp artisan project:clear\\nphp artisan optimize\\nphp artisan sitemap:generate\\nsudo systemctl restart php8.4-fpm<\/code><\/pre><h2>Script automatizado<\/h2><pre><code>bash docs\/deploys\/deploy.sh<\/code><\/pre><h2>Cola de trabajos en producci\u00f3n<\/h2><p>Se recomienda Redis como driver de cola. Configura un servicio systemd para el worker que se reinicie autom\u00e1ticamente.<\/p>"},"excerpt":{"en":"Guide to deploy on a VPS with Nginx, configure SSL, optimize Laravel for production and automate deployment.","es":"Gu\u00eda para desplegar en un VPS con Nginx, configurar SSL, optimizar Laravel para producci\u00f3n y automatizar el deploy."},"image":null,"status":"published","is_active":true,"featured":true,"user_id":1,"seo_title":{"en":"Production deployment with Nginx and PHP 8.4","es":"Despliegue en producci\u00f3n con Nginx y PHP 8.4"},"seo_description":{"en":"Complete production deployment guide: Nginx, environment variables, Laravel optimization and deploy scripts.","es":"Gu\u00eda completa para desplegar en producci\u00f3n: Nginx, variables de entorno, optimizaci\u00f3n Laravel y scripts de deploy."},"seo_keywords":null,"published_at":"2026-04-23T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-11T21:42:53.000000Z","deleted_at":null,"categories":[{"id":3,"slug":"despliegue","name":{"en":"Deployment","es":"Despliegue"},"pivot":{"post_id":6,"category_id":3}}]},{"id":5,"slug":"despliegue-docker-laravel","title":{"en":"Docker deployment","es":"Despliegue con Docker"},"content":{"en":"<h2>Services<\/h2><ul><li><strong>app<\/strong>: PHP 8.4 FPM<\/li><li><strong>nginx<\/strong>: Web server<\/li><li><strong>db<\/strong>: PostgreSQL with persistent volume<\/li><\/ul><h2>Start in development<\/h2><pre><code>docker compose up -d\\ndocker compose exec app php artisan project:install --force<\/code><\/pre>","es":"<h2>Servicios incluidos<\/h2><ul><li><strong>app<\/strong>: PHP 8.4 FPM con todas las extensiones necesarias<\/li><li><strong>nginx<\/strong>: Servidor web, configuraci\u00f3n en <code>docker\/nginx\/<\/code><\/li><li><strong>db<\/strong>: PostgreSQL con volumen persistente<\/li><\/ul><h2>Iniciar en desarrollo<\/h2><pre><code>cp .env.example .env\\n# Editar .env: DB_HOST=db\\ndocker compose up -d\\ndocker compose exec app php artisan project:install --force<\/code><\/pre><h2>Variables de entorno para Docker<\/h2><pre><code>APP_URL=http:\/\/localhost:8080\\nDB_CONNECTION=pgsql\\nDB_HOST=db\\nDB_PORT=5432\\nDB_DATABASE=laravel\\nDB_USERNAME=laravel\\nDB_PASSWORD=secret<\/code><\/pre><h2>Comandos artisan en Docker<\/h2><pre><code>docker compose exec app php artisan migrate\\ndocker compose exec app php artisan db:seed\\ndocker compose exec app php artisan queue:work<\/code><\/pre><h2>Storage persistente<\/h2><p>El directorio <code>storage\/app\/<\/code> est\u00e1 montado como volumen para que los archivos subidos persistan entre reinicios del contenedor.<\/p><h2>Reconstruir contenedores<\/h2><pre><code>docker compose build --no-cache app\\ndocker compose down\\n# Eliminar tambi\u00e9n vol\u00famenes (\u00a1borra datos de BD!)\\ndocker compose down -v<\/code><\/pre>"},"excerpt":{"en":"How to run the project with Docker in development and prepare it for production using docker-compose.","es":"C\u00f3mo levantar el proyecto con Docker en desarrollo y prepararlo para producci\u00f3n usando docker-compose."},"image":null,"status":"published","is_active":true,"featured":true,"user_id":1,"seo_title":{"en":"Docker Deployment \u2014 Step by step guide","es":"Despliegue con Docker \u2014 Gu\u00eda paso a paso"},"seo_description":{"en":"How to dockerize the Laravel project: services, environment variables, persistent storage and useful commands.","es":"C\u00f3mo dockerizar el proyecto Laravel: servicios, variables de entorno, storage persistente y comandos \u00fatiles."},"seo_keywords":null,"published_at":"2026-04-21T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-11T21:42:53.000000Z","deleted_at":null,"categories":[{"id":3,"slug":"despliegue","name":{"en":"Deployment","es":"Despliegue"},"pivot":{"post_id":5,"category_id":3}}]},{"id":4,"slug":"sistema-traducciones-spatie-translatable","title":{"en":"Translation system with Spatie Translatable","es":"Sistema de traducciones con Spatie Translatable"},"content":{"en":"<h2>Two translation levels<\/h2><ol><li><strong>Laravel language files<\/strong>: Static UI texts.<\/li><li><strong>spatie\/laravel-translatable<\/strong>: Dynamic model content stored as JSON.<\/li><\/ol><h2>Usage<\/h2><pre><code>$post->getTranslation(''title'', app()->getLocale());<\/code><\/pre><p>Change language by visiting <code>\/lang\/es<\/code> or <code>\/lang\/en<\/code>.<\/p>","es":"<h2>Dos niveles de traducci\u00f3n<\/h2><ol><li><strong>Archivos de idioma Laravel<\/strong> (<code>lang\/es\/<\/code>, <code>lang\/en\/<\/code>): Para textos est\u00e1ticos de la UI.<\/li><li><strong>spatie\/laravel-translatable<\/strong>: Para contenido din\u00e1mico en modelos (t\u00edtulos, contenido de Posts, Pages, Sections, Slides, Categories).<\/li><\/ol><h2>Campos almacenados como JSON en la BD<\/h2><pre><code>\/\/ Columna title (tipo JSON) en la tabla posts:\\n{\"es\": \"Mi art\u00edculo\", \"en\": \"My article\"}<\/code><\/pre><h2>Usar traducciones en c\u00f3digo<\/h2><pre><code>\/\/ Obtener traducci\u00f3n del locale actual\\n$post->getTranslation(''title'', app()->getLocale());\\n\\n\/\/ Guardar con traducci\u00f3n\\n$post->setTranslation(''title'', ''es'', ''Mi t\u00edtulo'');\\n$post->setTranslation(''title'', ''en'', ''My title'');\\n$post->save();<\/code><\/pre><h2>Usar traducciones en Blade<\/h2><pre><code>@{{-- Texto de interfaz (archivos lang\/) --}}\\n@{{ __(''messages.read_more'') }}\\n\\n@{{-- Contenido de modelo traducible --}}\\n@{{ $post->getTranslation(''title'', app()->getLocale()) }}<\/code><\/pre><h2>Cambiar idioma<\/h2><p>El usuario cambia el idioma visitando <code>\/lang\/es<\/code> o <code>\/lang\/en<\/code>. El middleware <code>SetLocale<\/code> lo persiste en sesi\u00f3n.<\/p><h2>A\u00f1adir campo traducible a un modelo<\/h2><ol><li>En la migraci\u00f3n, usar <code>->json(''campo'')<\/code><\/li><li>En el modelo, a\u00f1adir el campo al array <code>$translatable<\/code><\/li><li>En el Resource de Filament, usar tabs por idioma<\/li><\/ol>"},"excerpt":{"en":"How translations work in Eloquent models, how to switch language in the frontend and how to manage language files.","es":"C\u00f3mo funcionan las traducciones en los modelos Eloquent, c\u00f3mo cambiar el idioma en el frontend y c\u00f3mo gestionar los ficheros de idioma."},"image":null,"status":"published","is_active":true,"featured":false,"user_id":1,"seo_title":{"en":"ES\/EN Translations with Spatie Translatable","es":"Traducciones ES\/EN con Spatie Translatable"},"seo_description":{"en":"Complete translation system guide: language files, translatable models and language switching.","es":"Gu\u00eda completa del sistema de traducciones: archivos de idioma, modelos traducibles y cambio de idioma."},"seo_keywords":null,"published_at":"2026-04-19T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-12T17:54:40.000000Z","deleted_at":null,"categories":[{"id":1,"slug":"documentacion","name":{"en":"Documentation","es":"Documentaci\u00f3n"},"pivot":{"post_id":4,"category_id":1}}]},{"id":3,"slug":"api-rest-sanctum-documentacion","title":{"en":"REST API with Laravel Sanctum","es":"API REST con Laravel Sanctum"},"content":{"en":"<h2>API Structure<\/h2><p>The API is versioned under <code>\/api\/v1<\/code>. All controllers are in <code>app\/Http\/Controllers\/Api\/V1\/<\/code>.<\/p><h2>Authentication<\/h2><pre><code>curl -X POST \/api\/v1\/auth\/login \\\\n  -d ''{\"email\":\"admin@example.com\",\"password\":\"password\"}''<\/code><\/pre><p>Generate docs: <code>php artisan scribe:generate<\/code> \u2192 available at <code>\/docs<\/code><\/p>","es":"<h2>Estructura de la API<\/h2><p>La API est\u00e1 versionada bajo el prefijo <code>\/api\/v1<\/code>. Todos los controladores est\u00e1n en <code>app\/Http\/Controllers\/Api\/V1\/<\/code>.<\/p><h2>Endpoints p\u00fablicos (sin autenticaci\u00f3n)<\/h2><table><thead><tr><th>M\u00e9todo<\/th><th>Endpoint<\/th><th>Descripci\u00f3n<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td>\/api\/v1\/posts<\/td><td>Listado paginado de posts publicados<\/td><\/tr><tr><td>GET<\/td><td>\/api\/v1\/posts\/{slug}<\/td><td>Detalle de un post<\/td><\/tr><tr><td>GET<\/td><td>\/api\/v1\/pages<\/td><td>Listado paginado de p\u00e1ginas<\/td><\/tr><tr><td>GET<\/td><td>\/api\/v1\/pages\/{slug}<\/td><td>Detalle de una p\u00e1gina<\/td><\/tr><tr><td>GET<\/td><td>\/api\/v1\/categories<\/td><td>Listado de categor\u00edas<\/td><\/tr><tr><td>POST<\/td><td>\/api\/v1\/auth\/register<\/td><td>Registro de nuevo usuario<\/td><\/tr><tr><td>POST<\/td><td>\/api\/v1\/auth\/login<\/td><td>Login \u2014 devuelve Bearer token<\/td><\/tr><\/tbody><\/table><h2>Endpoints autenticados (Bearer token requerido)<\/h2><table><thead><tr><th>M\u00e9todo<\/th><th>Endpoint<\/th><th>Descripci\u00f3n<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td>\/api\/v1\/auth\/user<\/td><td>Datos del usuario autenticado<\/td><\/tr><tr><td>POST<\/td><td>\/api\/v1\/auth\/logout<\/td><td>Revoca el token actual<\/td><\/tr><tr><td>GET<\/td><td>\/api\/v1\/user\/tokens<\/td><td>Lista de tokens propios<\/td><\/tr><tr><td>POST<\/td><td>\/api\/v1\/user\/tokens<\/td><td>Crear nuevo token<\/td><\/tr><tr><td>DELETE<\/td><td>\/api\/v1\/user\/tokens\/{id}<\/td><td>Eliminar un token<\/td><\/tr><\/tbody><\/table><h2>Autenticaci\u00f3n \u2014 Flujo completo<\/h2><pre><code># 1. Obtener token\\ncurl -X POST \/api\/v1\/auth\/login \\\\n  -H \"Content-Type: application\/json\" \\\\n  -d ''{\"email\":\"admin@example.com\",\"password\":\"password\"}''\\n\\n# Respuesta: {\"token\": \"1|abc123...\"}\\n\\n# 2. Usar token en peticiones autenticadas\\ncurl -X GET \/api\/v1\/auth\/user \\\\n  -H \"Authorization: Bearer 1|abc123...\"<\/code><\/pre><h2>Documentaci\u00f3n con Scribe<\/h2><pre><code>php artisan scribe:generate<\/code><\/pre><p>Disponible en <code>\/docs<\/code>.<\/p>"},"excerpt":{"en":"How to use the project REST API: available endpoints, authentication with Sanctum tokens and how to generate documentation with Scribe.","es":"C\u00f3mo usar la API REST del proyecto: endpoints disponibles, autenticaci\u00f3n con tokens Sanctum y c\u00f3mo generar la documentaci\u00f3n con Scribe."},"image":null,"status":"published","is_active":true,"featured":true,"user_id":1,"seo_title":{"en":"REST API with Sanctum \u2014 Endpoints and authentication","es":"API REST con Sanctum \u2014 Endpoints y autenticaci\u00f3n"},"seo_description":{"en":"Complete REST API reference: public and authenticated endpoints, Sanctum tokens and Scribe documentation.","es":"Referencia completa de la API REST: endpoints p\u00fablicos y autenticados, tokens Sanctum y documentaci\u00f3n Scribe."},"seo_keywords":null,"published_at":"2026-04-16T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-11T21:42:53.000000Z","deleted_at":null,"categories":[{"id":2,"slug":"desarrollo","name":{"en":"Development","es":"Desarrollo"},"pivot":{"post_id":3,"category_id":2}},{"id":1,"slug":"documentacion","name":{"en":"Documentation","es":"Documentaci\u00f3n"},"pivot":{"post_id":3,"category_id":1}}]},{"id":2,"slug":"panel-administracion-filament","title":{"en":"Admin panel with Filament 5","es":"Panel de administraci\u00f3n con Filament 5"},"content":{"en":"<h2>Two separate panels<\/h2><ul><li><strong>Admin Panel <code>\/admin<\/code><\/strong>: Only for superadmin\/admin roles.<\/li><li><strong>User Panel <code>\/panel<\/code><\/strong>: Any active user. Profile and API token management only.<\/li><\/ul><h2>Add a new Resource<\/h2><pre><code>php artisan make:filament-resource ModelName --generate<\/code><\/pre>","es":"<h2>Dos paneles separados<\/h2><p>El proyecto incluye dos paneles Filament con acceso independiente:<\/p><ul><li><strong>Panel Admin <code>\/admin<\/code><\/strong>: Solo para usuarios con rol <code>superadmin<\/code> o <code>admin<\/code> y <code>is_active = true<\/code>. Gesti\u00f3n completa del sistema.<\/li><li><strong>Panel Usuario <code>\/panel<\/code><\/strong>: Para cualquier usuario con <code>is_active = true<\/code>. Solo puede editar su perfil y gestionar sus tokens API.<\/li><\/ul><h2>Recursos del Panel Admin<\/h2><table><thead><tr><th>Resource<\/th><th>Navigation Group<\/th><th>Descripci\u00f3n<\/th><\/tr><\/thead><tbody><tr><td>UserResource<\/td><td>Sistema<\/td><td>CRUD de usuarios con filtros por rol<\/td><\/tr><tr><td>PostResource<\/td><td>Contenido<\/td><td>Blog\/art\u00edculos con traducciones tabs<\/td><\/tr><tr><td>PageResource<\/td><td>Contenido<\/td><td>P\u00e1ginas est\u00e1ticas con traducciones<\/td><\/tr><tr><td>CategoryResource<\/td><td>Contenido<\/td><td>Categor\u00edas compartidas<\/td><\/tr><tr><td>SlideResource<\/td><td>Media<\/td><td>Carruseles agrupados por zona<\/td><\/tr><tr><td>SectionResource<\/td><td>Frontend<\/td><td>Secciones din\u00e1micas por zona<\/td><\/tr><tr><td>SettingResource<\/td><td>Sistema<\/td><td>Configuraci\u00f3n key-value<\/td><\/tr><tr><td>SentEmailResource<\/td><td>Sistema<\/td><td>Historial de emails enviados (solo lectura)<\/td><\/tr><\/tbody><\/table><h2>C\u00f3mo a\u00f1adir un nuevo Resource<\/h2><pre><code>php artisan make:filament-resource NombreModelo --generate<\/code><\/pre><p>El resource se crea en <code>app\/Filament\/Admin\/Resources\/<\/code>. Edita el Navigation Group en el m\u00e9todo <code>getNavigationGroup()<\/code>.<\/p><h2>Campos traducibles en Filament<\/h2><p>Los modelos con <code>HasTranslations<\/code> tienen tabs por idioma en sus formularios usando el componente <code>Tabs<\/code> de Filament.<\/p>"},"excerpt":{"en":"How the admin panel is structured, what resources it includes, how to access it and how to extend it with new resources.","es":"C\u00f3mo est\u00e1 estructurado el panel admin, qu\u00e9 recursos incluye, c\u00f3mo acceder y c\u00f3mo extenderlo con nuevos recursos."},"image":null,"status":"published","is_active":true,"featured":true,"user_id":1,"seo_title":{"en":"Filament 5 Admin Panel \u2014 Complete Guide","es":"Panel de administraci\u00f3n Filament 5 \u2014 Gu\u00eda completa"},"seo_description":{"en":"Admin panel usage guide: available resources, access, navigation groups and how to extend it.","es":"Gu\u00eda de uso del panel admin: recursos disponibles, acceso, grupos de navegaci\u00f3n y c\u00f3mo extenderlo."},"seo_keywords":null,"published_at":"2026-04-13T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-11T21:42:53.000000Z","deleted_at":null,"categories":[{"id":1,"slug":"documentacion","name":{"en":"Documentation","es":"Documentaci\u00f3n"},"pivot":{"post_id":2,"category_id":1}}]},{"id":1,"slug":"introduccion-skeleton-laravel-project","title":{"en":"Introduction to Skeleton Laravel Project","es":"Introducci\u00f3n al Skeleton Laravel Project"},"content":{"en":"<h2>What is Skeleton Laravel Project?<\/h2><p>It is a base template for Laravel projects that already has all common features implemented: web and API authentication, admin panel, content system, translations, SEO, Docker and more.<\/p><h2>Default credentials (seeders)<\/h2><table><thead><tr><th>Email<\/th><th>Password<\/th><th>Role<\/th><\/tr><\/thead><tbody><tr><td>admin@example.com<\/td><td>password<\/td><td>superadmin<\/td><\/tr><\/tbody><\/table><h2>Quick start<\/h2><pre><code>cp .env.example .env\\nphp artisan project:install<\/code><\/pre>","es":"<h2>\u00bfQu\u00e9 es el Skeleton Laravel Project?<\/h2><p>Es una plantilla base para proyectos Laravel que ya tiene implementadas todas las funcionalidades comunes: autenticaci\u00f3n web y API, panel de administraci\u00f3n, sistema de contenido, traducciones, SEO, Docker y m\u00e1s. El objetivo es que puedas empezar un nuevo proyecto sin dedicar semanas a configuraci\u00f3n y boilerplate.<\/p><h2>\u00bfQu\u00e9 incluye?<\/h2><ul><li><strong>PHP 8.4 + Laravel 13<\/strong>: El stack m\u00e1s moderno, con typed properties, enums backed y return types en todos los m\u00e9todos.<\/li><li><strong>Filament 5<\/strong>: Dos paneles separados. <code>\/admin<\/code> para superadmin\/admin y <code>\/panel<\/code> para usuarios registrados.<\/li><li><strong>Autenticaci\u00f3n completa<\/strong>: Web con Laravel Breeze y API con Sanctum. Roles: superadmin, admin, user.<\/li><li><strong>Sistema de contenido<\/strong>: Posts, Pages, Categor\u00edas, Slides y Sections, todos traducibles ES\/EN.<\/li><li><strong>API REST v1<\/strong>: Endpoints p\u00fablicos y autenticados, documentados con Scribe.<\/li><li><strong>SEO<\/strong>: Meta tags, Open Graph, Twitter Cards, JSON-LD, sitemap XML y hreflang.<\/li><li><strong>Docker<\/strong>: Configuraci\u00f3n lista para desarrollo y producci\u00f3n.<\/li><li><strong>Tests<\/strong>: Feature tests para autenticaci\u00f3n, API y rutas web.<\/li><\/ul><h2>Credenciales por defecto (seeders)<\/h2><table><thead><tr><th>Email<\/th><th>Password<\/th><th>Rol<\/th><\/tr><\/thead><tbody><tr><td>admin@example.com<\/td><td>password<\/td><td>superadmin<\/td><\/tr><tr><td>editor@example.com<\/td><td>password<\/td><td>admin<\/td><\/tr><\/tbody><\/table><h2>Inicio r\u00e1pido<\/h2><pre><code>cp .env.example .env\\ncomposer install &amp;&amp; npm install\\nphp artisan project:install\\nphp artisan serve\\nnpm run dev<\/code><\/pre><p>El comando <code>project:install<\/code> genera la clave, crea el enlace de storage, ejecuta migraciones y seeders, todo con confirmaciones paso a paso.<\/p><h2>Estructura de directorios clave<\/h2><pre><code>app\/\\n\u251c\u2500\u2500 Enums\/          # Role, ContentStatus, EmailStatus\\n\u251c\u2500\u2500 Filament\/       # Admin\/ y Panel\/ (Filament resources)\\n\u251c\u2500\u2500 Http\/\\n\u2502   \u251c\u2500\u2500 Controllers\/Api\/V1\/   # Controladores REST\\n\u2502   \u251c\u2500\u2500 Controllers\/Web\/      # Controladores frontend\\n\u2502   \u2514\u2500\u2500 Requests\/             # FormRequests validados\\n\u251c\u2500\u2500 Models\/         # User, Post, Page, Category, Slide, Section, Setting, SentEmail\\n\u251c\u2500\u2500 Services\/       # EmailService, SeoService, SettingService, SitemapService\\n\u2514\u2500\u2500 Traits\/         # HasSlug, HasStatus, HasSeo, BelongsToUser<\/code><\/pre>"},"excerpt":{"en":"Everything you need to know to understand this skeleton, what it includes and how to get the most out of it from day one.","es":"Todo lo que necesitas saber para entender qu\u00e9 es este skeleton, qu\u00e9 incluye y c\u00f3mo sacarle partido desde el primer d\u00eda."},"image":"posts\/01KRDYR0S6VEGNRW0SF0E5Y8YV.png","status":"published","is_active":true,"featured":true,"user_id":1,"seo_title":{"en":"Introduction to Skeleton Laravel Project","es":"Introducci\u00f3n al Skeleton Laravel Project"},"seo_description":{"en":"Getting started guide: what it includes, structure, credentials and how to start the project.","es":"Gu\u00eda de inicio al skeleton: qu\u00e9 incluye, estructura, credenciales y c\u00f3mo arrancar el proyecto."},"seo_keywords":{"en":null},"published_at":"2026-04-11T21:42:53.000000Z","created_at":"2026-05-11T21:42:53.000000Z","updated_at":"2026-05-12T18:20:09.000000Z","deleted_at":null,"categories":[{"id":2,"slug":"d